let objetivoActual = 0;



function moverTiburon() {

  const objetivo = rutaTiburon[objetivoActual];

  const direccion = new THREE.Vector3().subVectors(objetivo, tiburon.position);

  const distancia = direccion.length();

  if (distancia < 1) {
    objetivoActual = (objetivoActual + 1) % rutaTiburon.length;
    return;
  }

  direccion.normalize();

  const velocidad = 0.1;

  tiburon.position.add(direccion.multiplyScalar(velocidad));

  tiburon.lookAt(objetivo);

  tiburonBody.position.copy(tiburon.position);

  tiburonBody.quaternion.copy(tiburon.quaternion);
}




function crearTiburon(x, y, z, ruta) {

  const tib = tiburon.clone();
  tib.position.set(x, y, z);
  scene.add(tib);

  const body = new CANNON.Body({
    mass: 0,
    type: CANNON.Body.KINEMATIC
  });

  const shape = new CANNON.Box(new CANNON.Vec3(1, 3, 7));
  body.addShape(shape);
  body.position.copy(tib.position);

  world.addBody(body);

  tiburones.push({
    mesh: tib,
    body: body,
    ruta: ruta,
    objetivoActual: 0
  });

}

function moverTiburones() {

  tiburones.forEach(t => {

    const objetivo = t.ruta[t.objetivoActual];

    const direccion = new THREE.Vector3()
      .subVectors(objetivo, t.mesh.position);

    const distancia = direccion.length();

    if (distancia < 1) {
      t.objetivoActual = (t.objetivoActual + 1) % t.ruta.length;
      return;
    }

    direccion.normalize();

    const velocidad = 0.1;

    t.mesh.position.add(direccion.multiplyScalar(velocidad));
    t.mesh.lookAt(objetivo);

    t.body.position.copy(t.mesh.position);

    t.body.quaternion.copy(t.mesh.quaternion);

  });

}

function crearLingote(x, y, z) {

  // ✅ modelo
  const ling = lingote({ x, y, z });
  scene.add(ling);
  ling.scale.set(1,1,1);

  // ✅ calcular tamaño
  const box = new THREE.Box3().setFromObject(ling);
  const size = new THREE.Vector3();
  box.getSize(size);

  const shape = new CANNON.Box(new CANNON.Vec3(
    size.x / 2,
    size.y / 2,
    size.z / 2
  ));

  // ✅ cuerpo físico
  const body = new CANNON.Body({
    mass: 0
  });

  // 🔥 AQUÍ aplicas el OFFSET (lo importante)
  body.addShape(shape, new CANNON.Vec3(0, 1, 0));

  body.position.copy(ling.position);

  // opcional: solo detección
  body.collisionResponse = false;

  world.addBody(body);

  // ✅ agregar al sistema de puntos
  puntosData.push({
    mesh: ling,
    body: body,
    activo: true
  });
}

const acelerar =.5;
const desacelerar =0.5;
let currentSpeed =0;
let puedeSaltar = false; ////////////////////////////////////////////////
const saltoF = 10; ///////////////////////////////////////////////////////////

boxbody.addEventListener('collide', (event) => { /////////////////////////
  const contact = event.contact;
  //datos del contacto físico: Este objeto contiene cosas como:
//la normal del choque (ni) los cuerpos que colisionaron (bi, bj)
//la normal es un vector que apunta perpendicular a la superficie del choque

  if (!contact || !contact.ni) return; //Si no hay información de contacto o no hay normal, sal de la función
  let normal = contact.ni;

  // Asegurar dirección correcta
  if (contact.bi.id === boxbody.id) {
    normal = normal.scale(-1);
  }
  //Si el cuerpo A (bi) es tu personaje: inviertes la normal (scale(-1))
  // La normal apunta "desde el suelo hacia arriba"
  if (normal.y > 0.5) {
    puedeSaltar = true;
  }
//detectas si estás tocando el suelo
//y = 1 → completamente hacia arriba (suelo)
//y = 0 → pared
//y = -1 → techo
//Entonces: > 0.5 = superficie suficientemente horizontal
//Si chocas con una superficie que apunta hacia arriba → estás en el suelo → puedes saltar
});


function animate () {

if (juegoTerminado) return;

const forward = new THREE.Vector3(0, 0, -1);
gr1.getWorldDirection(forward);
forward.normalize();

if (keys['KeyW']){
    currentSpeed = Math.min(currentSpeed + acelerar, moveSpeed);

    mesh1.rotation.y = (Math.cos(reloj.getElapsedTime()*velocidad)*amplitud)
    mesh2.rotation.y = (Math.cos(reloj.getElapsedTime()*velocidad)*-amplitud)   
}
else if(keys['KeyS']){
  currentSpeed = Math.max(currentSpeed - acelerar, -moveSpeed);
  mesh1.rotation.y = (Math.cos(reloj.getElapsedTime()*velocidad)*-amplitud)
  mesh2.rotation.y = (Math.cos(reloj.getElapsedTime()*velocidad)*amplitud)   
}
else {
    if (currentSpeed > 0){
        currentSpeed = Math.max(currentSpeed - desacelerar,0);
    }
    else if (currentSpeed < 0){
        currentSpeed = Math.min(currentSpeed + desacelerar,0);
    }
}
boxbody.velocity.set(
    forward.x * currentSpeed,
    boxbody.velocity.y,
    forward.z*currentSpeed);
if (keys['KeyA']){
    boxbody.angularVelocity.y = rotar;
}
else if (keys['KeyD']){
    boxbody.angularVelocity.y = -rotar;
}
else{
    boxbody.angularVelocity.y = 0;
}

if (keys ['Space'] && puedeSaltar){

    boxbody.velocity.y = saltoF;
    puedeSaltar = false;
    //console.log("siya")
}

boxbody.angularVelocity.set(0,boxbody.angularVelocity.y,0);
boxbody.quaternion.x=0;
boxbody.quaternion.z=0;
gr1.quaternion.x=boxbody.quaternion.x;
gr1.quaternion.z=boxbody.quaternion.z;
}
